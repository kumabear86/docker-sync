name: Sync Immich Fixed Images to Aliyun ACR
on:
  workflow_dispatch: # GitHub 页面手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: registry.cn-shanghai.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Pull ghcr.io images → retag → push ACR(with retry)
        run: |
          set -e
          MAX_RETRY=3

          sync_image() {
            local SRC="$1"
            local DST="$2"
            echo "==================== Processing $SRC ===================="
            for ((attempt=1; attempt<=MAX_RETRY; attempt++)); do
              echo "Attempt $attempt / $MAX_RETRY pull $SRC"
              if docker pull "$SRC"; then
                docker tag "$SRC" "$DST"
                docker push "$DST"
                echo "✅ SUCCESS: $SRC → $DST"
                return 0
              fi
              echo "⚠️ Pull failed, sleep 8s for retry..."
              sleep 8
            done
            echo "❌ FAILED after ${MAX_RETRY} retries: $SRC"
            exit 1
          }

          # 同步 Immich v1.129.0 匹配的全部 4 个固定镜像
          sync_image ghcr.io/immich-app/immich-server:v1.129.0 registry.cn-shanghai.aliyuncs.com/rocm-forge/immich-server:v1.129.0
          sync_image ghcr.io/immich-app/immich-machine-learning:v1.129.0 registry.cn-shanghai.aliyuncs.com/rocm-forge/immich-machine-learning:v1.129.0
          sync_image ghcr.io/immich-app/postgres:16-vectorchord0.3.0-pgvectors0.3.0 registry.cn-shanghai.aliyuncs.com/rocm-forge/immich-postgres:16-vectorchord0.3.0-pgvectors0.3.0
          sync_image docker.io/valkey/valkey:8.0-alpine registry.cn-shanghai.aliyuncs.com/rocm-forge/valkey:8.0-alpine

          echo "==== 本次全量同步完成 ===="
