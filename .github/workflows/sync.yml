name: Sync Immich Images to Aliyun ACR

on:
  workflow_dispatch:
    inputs:
      immich_version:
        description: 'Immich Target Version Tag'
        required: true
        default: 'v3.1.0'
  push:
    branches:
      - main

env:
  IMMICH_VERSION: ${{ github.event.inputs.immich_version || 'v3.1.0' }}

jobs:
  sync-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 使用你创建的 ALIYUN_USERNAME 和 ALIYUN_PASSWORD
      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      # 1. Server 镜像
      - name: Pull, Tag and Push Immich Server
        run: |
          docker pull ghcr.io/immich-app/immich-server:${{ env.IMMICH_VERSION }}
          docker tag ghcr.io/immich-app/immich-server:${{ env.IMMICH_VERSION }} ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/immich-server:${{ env.IMMICH_VERSION }}
          docker push ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/immich-server:${{ env.IMMICH_VERSION }}

      # 2. Machine Learning 镜像
      - name: Pull, Tag and Push Immich Machine Learning
        run: |
          docker pull ghcr.io/immich-app/immich-machine-learning:${{ env.IMMICH_VERSION }}
          docker tag ghcr.io/immich-app/immich-machine-learning:${{ env.IMMICH_VERSION }} ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/immich-machine-learning:${{ env.IMMICH_VERSION }}
          docker push ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/immich-machine-learning:${{ env.IMMICH_VERSION }}

      # 3. PostgreSQL 兼容数据库镜像 (pg16-v0.2.0)
      - name: Pull, Tag and Push Database
        run: |
          docker pull tensorchord/pgvecto-rs:pg16-v0.2.0
          docker tag tensorchord/pgvecto-rs:pg16-v0.2.0 ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/pgvecto-rs:pg16-v0.2.0
          docker push ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/pgvecto-rs:pg16-v0.2.0
