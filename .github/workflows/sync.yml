name: Sync Docker Image to Aliyun ACR

on:
  workflow_dispatch: # 允许在 GitHub 界面手动点击运行

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          # 注意：如果你的 ACR 是上海或北京节点，请将 cn-hangzhou 修改为 cn-shanghai 或 cn-beijing
          registry: registry.cn-shanghai.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Pull from Docker Hub and Push to Aliyun
        run: |
          # 1. 从 Docker Hub 拉取指定的镜像
          docker pull rocm/pytorch:rocm7.2.4_ubuntu22.04_py3.10_pytorch_release_2.10.0
          
          # 2. 重新打 Tag（对应你的命名空间 rocm-forge）
          docker tag rocm/pytorch:rocm7.2.4_ubuntu22.04_py3.10_pytorch_release_2.10.0 registry.cn-shanghai.aliyuncs.com/rocm-forge/pytorch:2.10.0
          
          # 3. 推送到阿里云
          docker push registry.cn-shanghai.aliyuncs.com/rocm-forge/pytorch:2.10.0
