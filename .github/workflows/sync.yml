name: Sync Immich Images to Aliyun ACR
on:
  workflow_dispatch: # 允许GitHub页面手动触发
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: registry.cn-shanghai.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Pull ghcr.io images → retag → push ACR
        run: |
          # immich-server
          docker pull ghcr.io/immich-app/immich-server:v3
          docker tag ghcr.io/immich-app/immich-server:v3 registry.cn-shanghai.aliyuncs.com/rocm-forge/immich-server:v3
          docker push registry.cn-shanghai.aliyuncs.com/rocm-forge/immich-server:v3

          # immich-machine-learning AI模型服务
          docker pull ghcr.io/immich-app/immich-machine-learning:v3
          docker tag ghcr.io/immich-app/immich-machine-learning:v3 registry.cn-shanghai.aliyuncs.com/rocm-forge/immich-machine-learning:v3
          docker push registry.cn-shanghai.aliyuncs.com/rocm-forge/immich-machine-learning:v3

          # immich postgres
          docker pull ghcr.io/immich-app/postgres:v3
          docker tag ghcr.io/immich-app/postgres:v3 registry.cn-shanghai.aliyuncs.com/rocm-forge/postgres:v3
          docker push registry.cn-shanghai.aliyuncs.com/rocm-forge/postgres:v3

          # valkey(redis替代)，源在docker.io
          docker pull valkey/valkey:9
          docker tag valkey/valkey:9 registry.cn-shanghai.aliyuncs.com/rocm-forge/valkey:9
          docker push registry.cn-shanghai.aliyuncs.com/rocm-forge/valkey:9
