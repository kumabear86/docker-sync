name: Sync Immich Images to Aliyun ACR
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: registry.cn-shanghai.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Pull ghcr.io images -> retag -> push ACR
        run: |
          set -e
          MAX_RETRY=3

          sync_image() {
            local SRC="$1"
            local DST="$2"
            echo "==================== Processing $SRC ===================="
            for ((attempt=1; attempt<=MAX_RETRY; attempt++)); do
              echo "Attempt $attempt / $MAX_RETRY pull $SRC"
              if docker pull "$SRC"; then
                docker tag "$SRC" "$DST"
                docker push "$DST"
                echo "✅ SUCCESS: $SRC → $DST"
                return 0
              fi
              echo "⚠️ Pull failed, sleep 8s for retry..."
              sleep 8
            done
            echo "❌ FAILED after ${MAX_RETRY} retries: $SRC"
            exit 1
          }

          # 1. Immich 核心服务 (使用官方标准的 release 标签)
          # sync_image ghcr.io/immich-app/immich-server:release registry.cn-shanghai.aliyuncs.com/rocm-forge/immich-server:release
          # sync_image ghcr.io/immich-app/immich-machine-learning:release registry.cn-shanghai.aliyuncs.com/rocm-forge/immich-machine-learning:release

          # 2. 数据库与缓存中间件
          sync_image tensorchord/pgvecto-rs:pg16-v0.2.0 registry.cn-shanghai.aliyuncs.com/rocm-forge/immich-postgres:pg16-v0.2.0
          sync_image valkey/valkey:8-alpine registry.cn-shanghai.aliyuncs.com/rocm-forge/valkey:8-alpine

          echo "==== 镜像同步全部完成 ===="
